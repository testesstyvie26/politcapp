<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar — Politapp</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/site-theme.css?v=29" />
  <style>
    .auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
    .auth-card {
      width: 100%; max-width: 420px;
      background: var(--surface) !important; border: 1px solid var(--border);
      border-radius: 16px; padding: 1.75rem 1.6rem;
      box-shadow: var(--shadow); backdrop-filter: blur(20px);
    }
    .auth-brand { display: flex; align-items: center; gap: .6rem; margin-bottom: 1.25rem; }
    .auth-brand b { font-size: 1.15rem; letter-spacing: -.03em; color: #eef4fc; }
    .auth-tabs { display: flex; gap: .25rem; background: rgba(255,255,255,.04); border-radius: 10px; padding: .25rem; margin-bottom: 1.1rem; }
    .auth-tabs button {
      flex: 1; background: transparent !important; border: none; color: var(--muted) !important;
      padding: .55rem !important; border-radius: 8px !important; cursor: pointer; font-weight: 600 !important;
    }
    .auth-tabs button[aria-selected="true"] { background: rgba(59,130,246,.18) !important; color: #fff !important; }
    .auth-panel { display: none; }
    .auth-panel.is-active { display: block; }
    .field { display: flex; flex-direction: column; gap: .35rem; margin-bottom: .85rem; }
    .field label { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .btn-block { width: 100%; justify-content: center; margin-top: .35rem; }
    .btn-google {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: .5rem;
      background: #fff !important; color: #1f2937 !important; border: none; border-radius: 8px;
      padding: .65rem !important; font-weight: 600; cursor: pointer; margin-bottom: .85rem;
    }
    .sep { display: flex; align-items: center; gap: .6rem; color: var(--muted); font-size: .78rem; margin: .9rem 0; }
    .sep::before, .sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .auth-msg { font-size: .85rem; margin: .4rem 0 0; min-height: 1.2em; }
    .auth-msg.err { color: #fca5a5; }
    .auth-msg.ok { color: #6ee7b7; }
    .auth-foot { margin-top: 1rem; font-size: .8rem; color: var(--muted); text-align: center; }
    .auth-foot a { color: var(--accent); text-decoration: none; }
    .hide { display: none !important; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <main class="auth-card">
      <div class="auth-brand">
        <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="7" fill="#0b1730"/>
          <rect x="6" y="19" width="5" height="9" rx="1.5" fill="#3b82f6"/>
          <rect x="13.5" y="13" width="5" height="15" rx="1.5" fill="#c79235"/>
          <rect x="21" y="8" width="5" height="20" rx="1.5" fill="#3b82f6"/>
        </svg>
        <b>Politapp</b>
      </div>

      <div class="auth-tabs" role="tablist">
        <button role="tab" id="tabEntrar" aria-selected="true">Entrar</button>
        <button role="tab" id="tabCadastrar" aria-selected="false">Cadastrar</button>
      </div>

      <!-- ENTRAR -->
      <section class="auth-panel is-active" id="panelEntrar" role="tabpanel">
        <button type="button" class="btn-google" id="btnGoogle">
          <i class="fa-brands fa-google" aria-hidden="true"></i> Continuar com Google
        </button>

        <div class="sep">ou e-mail e senha</div>
        <div class="field">
          <label for="loginEmail">E-mail</label>
          <input type="email" id="loginEmail" autocomplete="email" placeholder="voce@exemplo.com" />
        </div>
        <div class="field">
          <label for="loginSenha">Senha</label>
          <input type="password" id="loginSenha" autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button type="button" class="btn-block" id="btnEntrar">Entrar</button>

        <div class="sep">ou por telefone</div>
        <div class="field">
          <label for="telLogin">Telefone (com DDD)</label>
          <input type="tel" id="telLogin" autocomplete="tel" placeholder="(21) 99876-5432" />
        </div>
        <button type="button" class="btn-block secondary" id="btnEnviarCodigo">Enviar código por SMS</button>
        <div id="otpBox" class="hide">
          <div class="field" style="margin-top:.85rem">
            <label for="otpCodigo">Código recebido</label>
            <input type="text" id="otpCodigo" inputmode="numeric" maxlength="6" placeholder="000000" />
          </div>
          <button type="button" class="btn-block" id="btnConfirmarCodigo">Confirmar código</button>
        </div>

        <p class="auth-msg" id="msgEntrar" role="status"></p>
      </section>

      <!-- CADASTRAR -->
      <section class="auth-panel" id="panelCadastrar" role="tabpanel">
        <button type="button" class="btn-google" id="btnGoogleReg">
          <i class="fa-brands fa-google" aria-hidden="true"></i> Cadastrar com Google
        </button>
        <div class="sep">ou com e-mail</div>
        <div class="field">
          <label for="regNome">Nome</label>
          <input type="text" id="regNome" autocomplete="name" placeholder="Seu nome" />
        </div>
        <div class="field">
          <label for="regEmail">E-mail</label>
          <input type="email" id="regEmail" autocomplete="email" placeholder="voce@exemplo.com" />
        </div>
        <div class="field">
          <label for="regSenha">Senha (mín. 8 caracteres)</label>
          <input type="password" id="regSenha" autocomplete="new-password" placeholder="••••••••" />
        </div>
        <button type="button" class="btn-block" id="btnCadastrar">Criar conta</button>
        <p class="auth-msg" id="msgCadastrar" role="status"></p>
      </section>

      <p class="auth-foot">
        Ao continuar você concorda com os
        <a href="termos-uso.html">Termos</a> e a <a href="privacidade.html">Privacidade</a>.
      </p>
    </main>
  </div>

  <script src="js/auth-config.js?v=35" data-cfasync="false"></script>
  <script type="module">
    import { lwLogin, lwRegister, lwPhoneRequest, lwPhoneVerify, lwGoogleStartUrl, lwMe, lwCaptureTokenFromHash, lwCompleteGoogleCallback }
      from "./js/locaweb-auth.js?v=35";

    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const next = params.get("next") || "index.html";
    const goNext = () => window.location.replace(new URL(next, location.href).href);

    function msg(el, txt, kind) { el.textContent = txt || ""; el.className = "auth-msg" + (kind ? " " + kind : ""); }

    async function initializeLogin() {
      const oauthError = params.get("erro");
      if (oauthError) msg($("msgEntrar"), oauthError, "err");
      lwCaptureTokenFromHash(); // compatibilidade com o callback PHP antigo
      const google = await lwCompleteGoogleCallback();
      if (google.handled && !google.ok) {
        msg($("msgEntrar"), google.erro || "Não foi possível concluir o login com Google.", "err");
        return;
      }
      const r = await lwMe();
      if (r && r.ok && r.autenticado) goNext();
    }
    initializeLogin().catch(() => msg($("msgEntrar"), "Não foi possível verificar a sessão.", "err"));

    // tabs
    function tab(entrar) {
      $("tabEntrar").setAttribute("aria-selected", entrar);
      $("tabCadastrar").setAttribute("aria-selected", !entrar);
      $("panelEntrar").classList.toggle("is-active", entrar);
      $("panelCadastrar").classList.toggle("is-active", !entrar);
    }
    $("tabEntrar").addEventListener("click", () => tab(true));
    $("tabCadastrar").addEventListener("click", () => tab(false));

    // Google
    const googleGo = () => { window.location.href = lwGoogleStartUrl(); };
    $("btnGoogle").addEventListener("click", googleGo);
    $("btnGoogleReg").addEventListener("click", googleGo);

    // Entrar com e-mail
    $("btnEntrar").addEventListener("click", async () => {
      const m = $("msgEntrar"); msg(m, "Entrando…");
      const r = await lwLogin($("loginEmail").value.trim().toLowerCase(), $("loginSenha").value);
      if (r.ok) { msg(m, "Bem-vindo!", "ok"); goNext(); }
      else msg(m, r.erro || "Falha no login", "err");
    });

    // Cadastrar com e-mail
    $("btnCadastrar").addEventListener("click", async () => {
      const m = $("msgCadastrar"); msg(m, "Criando conta…");
      const r = await lwRegister($("regEmail").value.trim().toLowerCase(), $("regSenha").value, $("regNome").value.trim());
      if (r.ok) { msg(m, "Conta criada!", "ok"); goNext(); }
      else msg(m, r.erro || "Falha no cadastro", "err");
    });

    // Telefone / OTP
    $("btnEnviarCodigo").addEventListener("click", async () => {
      const m = $("msgEntrar"); msg(m, "Enviando código…");
      const r = await lwPhoneRequest($("telLogin").value.trim());
      if (r.ok) { $("otpBox").classList.remove("hide"); msg(m, "Código enviado por SMS.", "ok"); }
      else msg(m, r.erro || "Não foi possível enviar", "err");
    });
    $("btnConfirmarCodigo").addEventListener("click", async () => {
      const m = $("msgEntrar"); msg(m, "Verificando…");
      const r = await lwPhoneVerify($("telLogin").value.trim(), $("otpCodigo").value.trim());
      if (r.ok) { msg(m, "Confirmado!", "ok"); goNext(); }
      else msg(m, r.erro || "Código inválido", "err");
    });

    // Enter envia o formulário de entrar
    $("loginSenha").addEventListener("keydown", (e) => { if (e.key === "Enter") $("btnEntrar").click(); });
  </script>
</body>
</html>
