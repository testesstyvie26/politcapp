name: Deploy PHP Locaweb

on:
  push:
    branches: [main]
    paths:
      - "php/**"
      - "scripts/deploy-locaweb-ftp.sh"
      - ".github/workflows/deploy-locaweb-php.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validar configuração FTP
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          test -n "$FTP_USER" || { echo "Secret FTP_USER ausente"; exit 1; }
          test -n "$FTP_PASS" || { echo "Secret FTP_PASS ausente"; exit 1; }
      - name: Instalar cliente FTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Publicar backend PHP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          REMOTE_DIR: /public_html/politicapp/php
        run: |
          export FTP_HOST="${FTP_HOST:-ftp.cmbusinesstoken1.hospedagemdesites.ws}"
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set ssl:verify-certificate no
          set net:max-retries 2
          set net:timeout 15
          mkdir -p "$REMOTE_DIR/api"
          mirror -R --verbose --delete ./php/api "$REMOTE_DIR/api"
          bye
          EOF
