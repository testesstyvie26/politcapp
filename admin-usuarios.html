<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Usuários cadastrados — Politapp</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    .wrap { max-width: 1180px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .4rem; }
    .lede { color: var(--muted); margin: 0 0 1.25rem; }
    .summary { display: flex; gap: .75rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .summary span { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: .55rem .8rem; color: var(--muted); }
    .summary strong { color: var(--text); }
    .filters { display: grid; grid-template-columns: minmax(220px, 2fr) repeat(2, minmax(150px, 1fr)); gap: .75rem; margin-bottom: 1rem; }
    .filters input, .filters select { width: 100%; min-height: 42px; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .86rem; }
    th, td { text-align: left; padding: .75rem .7rem; border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; }
    th { color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; }
    td:first-child { white-space: normal; min-width: 220px; }
    td small { display: block; color: var(--muted); margin-top: .2rem; }
    .status { display: inline-block; border-radius: 999px; padding: .2rem .55rem; font-size: .75rem; font-weight: 700; }
    .status.aprovado { color: #6ee7b7; background: rgba(16,185,129,.13); }
    .status.pendente { color: #fde68a; background: rgba(245,158,11,.13); }
    .status.rejeitado { color: #fca5a5; background: rgba(239,68,68,.13); }
    .status.neutro { color: var(--muted); background: rgba(148,163,184,.12); }
    .empty { color: var(--muted); text-align: center; padding: 1.6rem; }
    .err { color: var(--bad); margin: 0 0 1rem; }
    @media (max-width: 720px) { .filters { grid-template-columns: 1fr; } }
  </style>
  <link rel="stylesheet" href="css/site-shell-nav.css?v=29" />
  <link rel="stylesheet" href="css/site-theme.css?v=29" />
  <script type="module" src="js/site-nav.js?v=29"></script>
  <script type="module" src="js/site-bg.js?v=29"></script>
</head>
<body>
  <a class="politapp-skip" href="#politapp-main">Ir ao conteúdo</a>
  <script src="js/auth-config.js?v=32" data-cfasync="false"></script>
  <script type="module" src="js/auth-guard.js?v=29"></script>
  <div class="wrap">
    <nav class="site-nav" aria-label="Navegação">
      <a href="admin.html">Painel admin</a>
      <a href="admin-aprovacoes.html">Aprovar contas</a>
      <a href="admin-unidades.html">Unidades</a>
      <a href="conta.html">Conta</a>
    </nav>
    <main>
      <h1 id="politapp-main" tabindex="-1">Usuários cadastrados</h1>
      <p class="lede">Consulte todas as contas e acompanhe o acesso ao Politapp.</p>
      <div class="summary" aria-live="polite">
        <span>Total: <strong id="totalUsuarios">0</strong></span>
        <span>Exibidos: <strong id="totalResultado">0</strong></span>
      </div>
      <section class="filters" aria-label="Filtros">
        <input type="search" id="busca" placeholder="Buscar por nome, e-mail, unidade ou método" aria-label="Buscar usuários" />
        <select id="statusFiltro" aria-label="Filtrar por status">
          <option value="">Todos os status</option><option value="aprovado">Aprovados</option>
          <option value="pendente">Pendentes</option><option value="rejeitado">Rejeitados</option>
        </select>
        <select id="grupoFiltro" aria-label="Filtrar por grupo">
          <option value="">Todos os grupos</option><option value="admin">Administração</option>
          <option value="gestao">Gestão</option><option value="operacoes">Operações</option>
        </select>
      </section>
      <p id="err" class="err" hidden></p>
      <section class="panel" aria-label="Lista de usuários">
        <table>
          <thead><tr><th>Usuário</th><th>Grupo</th><th>Unidade</th><th>Status</th><th>Acesso</th><th>Cadastro</th><th>Último login</th></tr></thead>
          <tbody id="tbody"><tr><td colspan="7" class="empty">Carregando…</td></tr></tbody>
        </table>
      </section>
    </main>
  </div>
  <script type="module" src="js/admin-usuarios.js?v=1"></script>
</body>
</html>
